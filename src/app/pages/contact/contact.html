<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • CONTACT</p><h1>Contact Us</h1><p>Send a message to the FandomVerse team.</p></div><div class="two"><form class="card" (ngSubmit)="submit()"><label>Name<input [(ngModel)]="name" name="name" required></label><label>Email<input [(ngModel)]="email" name="email" type="email" required></label><label>Message<textarea [(ngModel)]="message" name="message" rows="6" required></textarea></label><button class="btn" type="submit">Send Message</button><p *ngIf="sent" class="muted">Thanks! Your demo message has been submitted locally.</p></form><div class="card"><h2>Team Contact</h2><p class="muted">Email: team@fandomverse.example</p><p class="muted">Location: FandomVerse Community Hub</p><button class="btn" type="button" (click)="useMyLocation()">Use My GPS Location</button><p class="muted">{{gpsStatus}}</p><iframe class="map" [src]="mapUrl | safeUrl" title="Google Map"></iframe></div></div></section>
