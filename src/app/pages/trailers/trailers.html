<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • TRAILERS</p><h1>Trailer Vault</h1><p>Dedicated trailer collection with category and release-status filtering.</p></div><div class="toolbar"><select [(ngModel)]="category"><option value="all">All Categories</option><option value="anime">Anime</option><option value="gaming">Gaming</option><option value="movies">Movies</option><option value="tvShows">TV Shows</option><option value="kpop">K-Pop</option><option value="comics">Comics</option><option value="manga">Manga</option></select><select [(ngModel)]="status"><option value="all">All Status</option><option value="upcoming">Upcoming</option><option value="recently-released">Recently Released</option></select></div><div class="grid"><article class="card" *ngFor="let t of filtered" (click)="openVideo()" tabindex="0" role="button" (keydown.enter)="openVideo()"><img class="media-img clickable-media" [src]="t.image" [alt]="t.title"><span class="tag">{{t.category}}</span><span class="tag">{{t.status}}</span><h2>{{t.title}}</h2><p class="muted">Click the picture/card to open the YouTube video.</p></article></div></section>
