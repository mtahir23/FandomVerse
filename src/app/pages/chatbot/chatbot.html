<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • CHATBOT</p><h1>Fandom Guide</h1><p>A lightweight rule-based assistant using a pre-scripted FAQ dataset.</p></div><div class="chat card"><div class="messages"><div *ngFor="let m of messages" [class.user]="m.from==='user'" class="bubble">{{m.text}} <a *ngIf="m.route" [routerLink]="m.route" class="chat-link">Open relevant page →</a></div></div><div class="suggestions"><button *ngFor="let f of faq" class="tag" (click)="suggest(f.q)">{{f.q}}</button></div><form (ngSubmit)="ask()"><input [(ngModel)]="question" name="question" placeholder="Ask a question..."><button class="btn">Send</button></form></div></section>
