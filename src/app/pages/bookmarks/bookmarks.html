<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • SAVED</p><h1>Bookmarks</h1><p>Favorites are stored in LocalStorage. Personal notes are stored for this browser session.</p><button class="btn" (click)="export()">Export Bookmarks</button></div><div class="grid"><article class="card" *ngFor="let item of items"><img class="media-img" [src]="'/' + item.image" [alt]="item.name"><span class="tag">{{item.category}}</span><h2>{{item.name}}</h2><p class="muted">{{item.series}}</p><label class="note-label">Personal note<textarea [(ngModel)]="item.note" rows="3" placeholder="Add a session-only note..."></textarea></label><button class="btn" (click)="saveNote(item)">Save Note</button> <button class="btn" (click)="remove(item)">Remove Bookmark</button></article></div><div class="state" *ngIf="!items.length">No bookmarks yet. Use the bookmark controls on content cards.</div></section>
