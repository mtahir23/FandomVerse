<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • ARTICLES</p><h1>Featured Articles</h1><p>Long-form fandom stories and guides, organized by category.</p></div><div class="grid"><article class="card" *ngFor="let a of items"><span class="tag">{{a.category}}</span><h2>{{a.title}}</h2><p class="muted">{{a.excerpt}}</p><small>{{a.date}}</small><div><button class="btn" (click)="open(a)">Read Article</button></div></article></div><div class="modal" *ngIf="selected" (click)="close()"><article class="modal-card" (click)="$event.stopPropagation()"><button class="close" (click)="close()">×</button><span class="tag">{{selected.category}}</span><h2>{{selected.title}}</h2><p>{{selected.content}}</p><p class="muted">Published {{selected.date}}</p><hr><h3>Related Content</h3><div class="related" *ngFor="let r of related"><button class="btn" (click)="open(r)">{{r.title}}</button></div></article></div></section>
