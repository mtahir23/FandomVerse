<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • EVENTS</p><h1>Event Highlights</h1><p>Past and upcoming fandom gatherings, meetups and watch-party style events.</p></div><div class="toolbar"><select [(ngModel)]="category"><option value="all">All Categories</option><option value="anime">Anime</option><option value="gaming">Gaming</option><option value="movies">Movies</option><option value="tvShows">TV Shows</option><option value="kpop">K-Pop</option><option value="comics">Comics</option><option value="manga">Manga</option></select></div><div class="grid"><article class="card" *ngFor="let e of filtered"><span class="tag">{{e.category}}</span><h2>{{e.title}}</h2><p><strong>{{e.date}}</strong> · {{e.location}}</p><p class="muted">{{e.description}}</p></article></div></section>
