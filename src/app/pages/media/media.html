<section class="page"><div class="hero"><p class="eyebrow">FANDOMVERSE • MEDIA</p><h1>Media Universe</h1><p>Explore galleries, trailers, interviews and playable audio across every fandom.</p></div><div class="toolbar"><button *ngFor="let t of ['gallery','videos','audio']" (click)="tab=t" [class.active]="tab===t">{{t|titlecase}}</button><select [(ngModel)]="category"><option value="all">All Categories</option><option value="anime">Anime</option><option value="gaming">Gaming</option><option value="movies">Movies</option><option value="tvShows">TV Shows</option><option value="kpop">K-Pop</option><option value="comics">Comics</option><option value="manga">Manga</option></select></div><div *ngIf="!data" class="state">Loading media...</div><div class="grid" *ngIf="data"><article class="card" *ngFor="let item of list" (click)="openVideo()" tabindex="0" role="button" (keydown.enter)="openVideo()"><img class="media-img clickable-media" [src]="item.image" [alt]="item.title"><h2>{{item.title}}</h2><p class="muted">{{item.description}}</p><span class="tag">{{item.category}}</span> <span class="tag">{{item.type}}</span><audio *ngIf="item.type==='Audio'" controls [src]="item.url" (click)="$event.stopPropagation()"></audio><p *ngIf="item.type!=='Audio'" class="muted">Click the picture/card to open the YouTube video.</p></article></div></section>
